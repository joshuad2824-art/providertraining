# Netlify deploy for the provider training site.
#
# There is no build. The site in dist-github/ is plain static files — nothing to
# compile, install or bundle — so Netlify's job is only to publish that folder.

[build]
  publish = "dist-github"
  command = ""

# This site is internal and must not be deployed until it is password protected.
#
# Visitor access is an account setting, not a file one — it lives in the Netlify
# UI under Site configuration → Access & security → Visitor access. It is also a
# paid feature: on the free tier the API rejects it with a 422, which is where
# this stands today. The project (oktul-cerner-provider-training) exists but has
# deliberately never been deployed, so there is nothing at the URL to protect
# yet. Upgrade the team to Pro, set the password, and deploy in that order.
#
# The header below is the second line of defence: if protection is ever dropped,
# search engines are still told to stay out, so an accidentally-open site does
# not also become an indexed one.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The pages fetch nothing from the internet (see dist-github/README.md), so
    # the policy can be this tight. If a future edit reintroduces a CDN
    # reference, the page breaks here before it breaks on a hospital network —
    # which is the point. 'unsafe-eval' and inline scripts are what the
    # design-canvas runtime in support.js needs to render its templates.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"

# The single-file offline build is meant to be saved and passed around, so serve
# it as a download rather than rendering it in the tab.
[[headers]]
  for = "/Cerner for Providers - offline.html"
  [headers.values]
    Content-Disposition = "attachment"
