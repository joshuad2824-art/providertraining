# Netlify deploy for the provider training site.
#
# There is no build. The site in dist-github/ is plain static files — nothing to
# compile, install or bundle — so Netlify's job is only to publish that folder.

[build]
  publish = "dist-github"
  command = ""

# This site is deliberately public, and search engines are asked to stay out.
#
# It was going to sit behind a Netlify visitor password, but that is a paid
# feature — on this team's free plan the API rejects it with a 422. The call
# was made to publish anyway rather than wait: the content is published OKTUL
# job aids and screenshots of test patients from the training domain, with no
# PHI in any of it.
#
# So the headers below are not a second line of defence. They are the only
# control on this site, and they only discourage indexing — anyone with the URL
# can read it. Do not add anything here that would not be fine on the open web.
#
# If you do want it private later: upgrade the team to Netlify Pro, then set the
# password under Site configuration -> Access & security -> Visitor access. It
# is an account setting, not a file one, so it cannot be turned on from here.

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The pages fetch nothing from the internet (see dist-github/README.md), so
    # the policy can be this tight. If a future edit reintroduces a CDN
    # reference, the page breaks here before it breaks on a hospital network —
    # which is the point. 'unsafe-eval' and inline scripts are what the
    # design-canvas runtime in support.js needs to render its templates.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"

# The single-file offline build is meant to be saved and passed around, so serve
# it as a download rather than rendering it in the tab.
[[headers]]
  for = "/Cerner for Providers - offline.html"
  [headers.values]
    Content-Disposition = "attachment"
